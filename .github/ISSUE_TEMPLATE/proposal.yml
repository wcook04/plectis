name: Question or proposal
description: Ask how something works, or propose a feature, component, or use case.
labels: ["question"]
body:
  - type: textarea
    id: question
    attributes:
      label: Question or proposal
      description: What are you trying to do, or what would you like to see?
    validations:
      required: true
  - type: textarea
    id: context
    attributes:
      label: Context
      description: What you already tried, or where you looked (e.g. `plectis comprehend --first-action "<goal>"`, the System map).
    validations:
      required: false
