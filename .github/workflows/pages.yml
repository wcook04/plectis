name: Deploy static site to Pages

on:
  push:
    branches:
      - main
    paths:
      - .github/workflows/pages.yml
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout published static site
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7
        with:
          ref: gh-pages
          path: site
          persist-credentials: false

      - name: Configure GitHub Pages
        uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d # v6

      - name: Prepare slim static site
        run: |
          set -eu
          mkdir -p _site/assets _site/docs

          for file in \
            index.html \
            plectis.html \
            404.html \
            SOURCE_CONTRACT.md \
            _headers \
            _redirects \
            llms.txt \
            robots.txt \
            security.txt \
            sitemap.xml \
            plectis-ai-review-packet.json \
            plectis-ai-reader-digest.json \
            plectis-ai-reader-complete.json \
            plectis-site-map.json \
            microcosm-ai-review-packet.json \
            microcosm-ai-reader-digest.json \
            microcosm-ai-reader-complete.json \
            microcosm-site-map.json \
            content-graph.json \
            object-map.json; do
            cp "site/$file" "_site/$file"
          done

          cp -R site/docs/. _site/docs/

          cp -R site/assets/. _site/assets/

          cat > _site/assets/ai-review-packet.js <<'JS'
          (function () {
            var scriptUrl = document.currentScript && document.currentScript.src ? document.currentScript.src : '';
            var siteRoot = scriptUrl ? scriptUrl.replace(/assets\/ai-review-packet\.js(?:[?#].*)?$/, '') : '../';
            var request = new XMLHttpRequest();
            request.open('GET', siteRoot + 'plectis-ai-review-packet.json', false);
            request.send(null);
            if (request.status < 200 || request.status >= 300) throw new Error('Could not load plectis-ai-review-packet.json');
            window.__MICROCOSM_AI_REVIEW_PACKET_JSON__ = request.responseText;
          }());
          JS

          cat > _site/assets/site-packet.js <<'JS'
          (function () {
            var scriptUrl = document.currentScript && document.currentScript.src ? document.currentScript.src : '';
            var siteRoot = scriptUrl ? scriptUrl.replace(/assets\/site-packet\.js(?:[?#].*)?$/, '') : '../';
            var request = new XMLHttpRequest();
            request.open('GET', siteRoot + 'plectis-site-map.json', false);
            request.send(null);
            if (request.status < 200 || request.status >= 300) throw new Error('Could not load plectis-site-map.json');
            window.__MICROCOSM_SITE_PACKET__ = JSON.parse(request.responseText);
          }());
          JS

      - name: Assert advertised downloads exist
        run: |
          set -eu
          for file in \
            plectis-ai-review-packet.json \
            plectis-ai-reader-digest.json \
            plectis-ai-reader-complete.json \
            plectis-site-map.json \
            microcosm-ai-review-packet.json \
            microcosm-ai-reader-digest.json \
            microcosm-ai-reader-complete.json \
            microcosm-site-map.json \
            content-graph.json \
            object-map.json \
            assets/ai-review-packet.js \
            assets/ai-reader-digest-packet.js \
            assets/site-packet.js \
            assets/search-index.js \
            assets/object-map.js; do
            test -s "_site/$file"
          done

      - name: Upload static site
        uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5
        with:
          path: _site

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@cd2ce8fcbc39b97be8ca5fce6e763baed58fa128 # v5
