name: Deploy static site to Pages

on:
  push:
    branches:
      - main
    paths:
      - .github/workflows/pages.yml
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout published static site
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7
        with:
          ref: gh-pages
          path: site
          persist-credentials: false

      - name: Configure GitHub Pages
        uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d # v6

      - name: Prepare static site
        run: |
          set -eu
          mkdir -p _site

          # Publish the whole gh-pages tree. This step used to name each file
          # it copied, which meant anything added to gh-pages was silently
          # dropped the next time this workflow ran: the three papers, the
          # canonical .well-known/security.txt, the search-console
          # verification file, .nojekyll, and several manifests were all
          # absent from the list. A deploy path that has to be told about
          # every new file will eventually be told about none of them.
          tar --exclude=.git -C site -cf - . | tar -C _site -xf -

          test -f _site/.nojekyll || touch _site/.nojekyll

          cat > _site/assets/ai-review-packet.js <<'JS'
          (function () {
            var scriptUrl = document.currentScript && document.currentScript.src ? document.currentScript.src : '';
            var siteRoot = scriptUrl ? scriptUrl.replace(/assets\/ai-review-packet\.js(?:[?#].*)?$/, '') : '../';
            var request = new XMLHttpRequest();
            request.open('GET', siteRoot + 'plectis-ai-review-packet.json', false);
            request.send(null);
            if (request.status < 200 || request.status >= 300) throw new Error('Could not load plectis-ai-review-packet.json');
            window.__MICROCOSM_AI_REVIEW_PACKET_JSON__ = request.responseText;
          }());
          JS

          cat > _site/assets/site-packet.js <<'JS'
          (function () {
            var scriptUrl = document.currentScript && document.currentScript.src ? document.currentScript.src : '';
            var siteRoot = scriptUrl ? scriptUrl.replace(/assets\/site-packet\.js(?:[?#].*)?$/, '') : '../';
            var request = new XMLHttpRequest();
            request.open('GET', siteRoot + 'plectis-site-map.json', false);
            request.send(null);
            if (request.status < 200 || request.status >= 300) throw new Error('Could not load plectis-site-map.json');
            window.__MICROCOSM_SITE_PACKET__ = JSON.parse(request.responseText);
          }());
          JS

      - name: Assert advertised downloads exist
        run: |
          set -eu
          for file in \
            plectis-ai-review-packet.json \
            plectis-ai-reader-digest.json \
            plectis-ai-reader-complete.json \
            plectis-site-map.json \
            microcosm-ai-review-packet.json \
            microcosm-ai-reader-digest.json \
            microcosm-ai-reader-complete.json \
            microcosm-site-map.json \
            content-graph.json \
            object-map.json \
            assets/ai-review-packet.js \
            assets/ai-reader-digest-packet.js \
            assets/site-packet.js \
            assets/search-index.js \
            assets/object-map.js \
            .well-known/security.txt \
            papers/plectis-public-system.pdf \
            papers/erdos249-257-main-paper.pdf \
            papers/claim-faithful-publication-systems-paper.pdf; do
            test -s "_site/$file"
          done

          # Whatever gh-pages serves, this artifact serves. Compare the two
          # trees directly so a missing route fails the deploy rather than
          # reaching the public site as a 404.
          missing="$(comm -23 \
            <(cd site && find . -type f -not -path './.git/*' | sort) \
            <(cd _site && find . -type f | sort))"
          if [ -n "$missing" ]; then
            echo "gh-pages files absent from the deploy artifact:" >&2
            echo "$missing" >&2
            exit 1
          fi

      - name: Upload static site
        uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5
        with:
          path: _site

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@cd2ce8fcbc39b97be8ca5fce6e763baed58fa128 # v5
