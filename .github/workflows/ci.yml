name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  tests:
    name: Tests Python ${{ matrix.python-version }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        # A cold reader runs `make test` under whatever `python3` they already
        # have, so the newest released interpreter is part of the promise this
        # repository makes and is tested here rather than discovered by them.
        python-version: ["3.11", "3.12", "3.13", "3.14"]

    steps:
      - name: Check out repository
        # Public action tag: actions/checkout@v7. The workflow pins the action by SHA below.
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
          fetch-depth: 0 # the paper check resolves the pinned snapshot commit in history

      - name: Set up Python
        # Public action tag: actions/setup-python@v7. The workflow pins the action by SHA below.
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: ${{ matrix.python-version }}

      - name: Run repository verification target
        run: make ci

  first-contact:
    # The published first screen, run as a stranger runs it. Deliberately no
    # actions/setup-python step: the promise this repository makes is to the
    # `python3` a reader already has, and pinning an interpreter here would
    # test a machine nobody arrives on. macOS is in the matrix because that is
    # where the documented install command was refused under PEP 668 while
    # every Ubuntu job stayed green.
    name: Documented first contact (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        os: ["macos-latest", "ubuntu-latest"]

    steps:
      - name: Check out repository
        # Public action tag: actions/checkout@v7. The workflow pins the action by SHA below.
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false

      - name: Report the interpreter a reader would actually use
        run: |
          python3 -VV
          python3 - <<'PY'
          import os, sysconfig
          marker = os.path.join(sysconfig.get_paths()["stdlib"], "EXTERNALLY-MANAGED")
          print("externally managed:", os.path.exists(marker))
          PY

      - name: Run the documented no-install route
        run: PYTHONPATH=src python3 -m plectis tour --format text .

      - name: Run the documented install route
        run: |
          python3 -m venv .venv
          .venv/bin/python -m pip install .
          .venv/bin/plectis tour --format text .

  user-smoke:
    name: User smoke and timing
    runs-on: ubuntu-latest
    timeout-minutes: 30
    needs: tests

    steps:
      - name: Check out repository
        # Public action tag: actions/checkout@v7. The workflow pins the action by SHA below.
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false

      - name: Set up Python
        # Public action tag: actions/setup-python@v7. The workflow pins the action by SHA below.
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: "3.13"

      - name: Run user smoke floor
        run: make smoke

      - name: Run installed package smoke
        run: make package-smoke
