name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  tests:
    name: Tests Python ${{ matrix.python-version }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        # A cold reader runs `make test` under whatever `python3` they already
        # have, so the newest released interpreter is part of the promise this
        # repository makes and is tested here rather than discovered by them.
        python-version: ["3.11", "3.12", "3.13", "3.14"]

    steps:
      - name: Check out repository
        # Public action tag: actions/checkout@v7. The workflow pins the action by SHA below.
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
          fetch-depth: 0

      - name: Set up Python
        # Public action tag: actions/setup-python@v7. The workflow pins the action by SHA below.
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: ${{ matrix.python-version }}

      - name: Run repository verification target
        run: make ci

      - name: Ensure verification preserves tracked inputs
        run: git diff --exit-code HEAD --

  standalone-export:
    name: Standalone export and installation
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Check out repository
        # Public action tag: actions/checkout@v7. Pinned by SHA below.
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
          fetch-depth: 0
      - name: Set up Python
        # Public action tag: actions/setup-python@v7. Pinned by SHA below.
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: "3.12"
      - name: Build and smoke-test the standalone export
        run: make standalone-export EXPORT_OUT="$RUNNER_TEMP/plectis-export"
      - name: Verify and install from the exported directory
        run: make -C "$RUNNER_TEMP/plectis-export/plectis" ci
      - name: Retain export and smoke evidence
        if: always()
        # Public action tag: actions/upload-artifact@v7. Pinned by SHA below.
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: standalone-export-evidence
          path: |
            ${{ runner.temp }}/plectis-export/plectis/receipts/release/release_export_receipt.json
            ${{ runner.temp }}/plectis-export/plectis/.microcosm/smoke/**
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 14
      - name: Ensure export preserves tracked inputs
        if: always()
        run: git diff --exit-code HEAD --

  first-contact:
    # The published first screen, run as a stranger runs it. Deliberately no
    # actions/setup-python step: the promise this repository makes is to the
    # `python3` a reader already has, and pinning an interpreter here would
    # test a machine nobody arrives on. macOS is in the matrix because that is
    # where the documented install command was refused under PEP 668 while
    # every Ubuntu job stayed green.
    name: Documented first contact (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        os: ["macos-latest", "ubuntu-latest"]

    steps:
      - name: Check out repository
        # Public action tag: actions/checkout@v7. The workflow pins the action by SHA below.
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false

      - name: Report the interpreter a reader would actually use
        run: |
          python3 -VV
          python3 - <<'PY'
          import os, sysconfig
          marker = os.path.join(sysconfig.get_paths()["stdlib"], "EXTERNALLY-MANAGED")
          print("externally managed:", os.path.exists(marker))
          PY

      - name: Run the documented no-install route
        run: PYTHONPATH=src python3 -m plectis tour --format text .

      - name: Run the portable operations example
        run: make operations-demo

      - name: Run the documented install route
        run: |
          python3 -m venv .venv
          .venv/bin/python -m pip install .
          .venv/bin/plectis tour --format text .

      - name: Ensure first contact preserves tracked inputs
        run: git diff --exit-code HEAD --

  user-smoke:
    name: User smoke and timing
    runs-on: ubuntu-latest
    timeout-minutes: 30
    needs: tests

    steps:
      - name: Check out repository
        # Public action tag: actions/checkout@v7. The workflow pins the action by SHA below.
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false

      - name: Set up Python
        # Public action tag: actions/setup-python@v7. The workflow pins the action by SHA below.
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: "3.13"

      - name: Run user smoke floor
        run: make smoke

      - name: Run installed package smoke
        run: make package-smoke

      - name: Ensure smoke preserves tracked inputs
        run: git diff --exit-code HEAD --

  component-replays:
    name: Replay every public component
    runs-on: macos-15
    timeout-minutes: 60
    env:
      ELAN_TOOLCHAIN: leanprover/lean4:v4.29.1
    steps:
      - name: Check out repository
        # Public action tag: actions/checkout@v7. The workflow pins the action by SHA below.
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
          fetch-depth: 0
      - name: Set up Python
        # Public action tag: actions/setup-python@v7. The workflow pins the action by SHA below.
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: "3.12"
      - name: Install the pinned Lean toolchain
        shell: bash
        run: |
          export ELAN_HOME="$RUNNER_TEMP/plectis-elan"
          echo "ELAN_HOME=$ELAN_HOME" >> "$GITHUB_ENV"
          case "$(uname -m)" in
            arm64) archive=elan-aarch64-apple-darwin.tar.gz; digest=7ad829861392c718dfebde3a83b5c8508df47be02af68894b094b0b3952616e5 ;;
            x86_64) archive=elan-x86_64-apple-darwin.tar.gz; digest=8a340b309d8ed2e96f930761fa223b3af57a38f5d253b53ac90293c9516f8cd4 ;;
            *) exit 1 ;;
          esac
          curl --fail --location --retry 3 --output "$RUNNER_TEMP/elan.tar.gz" \
            "https://github.com/leanprover/elan/releases/download/v4.2.4/$archive"
          echo "$digest  $RUNNER_TEMP/elan.tar.gz" | shasum -a 256 --check
          mkdir "$RUNNER_TEMP/plectis-elan-installer"
          tar -xzf "$RUNNER_TEMP/elan.tar.gz" -C "$RUNNER_TEMP/plectis-elan-installer"
          "$RUNNER_TEMP/plectis-elan-installer/elan-init" -y --no-modify-path --default-toolchain "$ELAN_TOOLCHAIN"
          echo "$ELAN_HOME/bin" >> "$GITHUB_PATH"
      - name: Report native dependencies and storage
        run: |
          python3 -VV
          lean --version
          lake --version
          swift --version
          df -h . "$RUNNER_TEMP"
          printf 'import Std\n#check Nat\n' | lean --stdin
      - name: Replay all registered public inputs
        run: make component-replays VENV="$RUNNER_TEMP/plectis-components-venv"
      - name: Retain component replay evidence
        if: always()
        # Public action tag: actions/upload-artifact@v7. Pinned to the reviewed upstream tag.
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: component-replay-evidence
          path: .microcosm/component-replays/**
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 14
      - name: Ensure replays preserve tracked inputs
        if: always()
        run: git diff --exit-code HEAD --

  formal-operations:
    name: Recheck executable decision cores
    runs-on: ubuntu-22.04
    timeout-minutes: 15
    steps:
      - name: Check out repository
        # Public action tag: actions/checkout@v7. The workflow pins the action by SHA below.
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - name: Set up Python
        # Public action tag: actions/setup-python@v7. The workflow pins the action by SHA below.
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: "3.11"
      - name: Fetch the pinned official Dafny distribution
        shell: bash
        run: |
          curl --fail --location --retry 3 --output "$RUNNER_TEMP/dafny.zip" \
            https://github.com/dafny-lang/dafny/releases/download/v4.11.0/dafny-4.11.0-x64-ubuntu-22.04.zip
          echo "a46a9ff7cdd720f7955854c78e95df13f4cfe6b80691b05f8654fe19e8267179  $RUNNER_TEMP/dafny.zip" | sha256sum --check
          unzip -q "$RUNNER_TEMP/dafny.zip" -d "$RUNNER_TEMP/plectis-dafny"
      - name: Verify proofs, generated bytes and executable mutants
        shell: bash
        run: |
          set -o pipefail
          git rev-parse HEAD > "$RUNNER_TEMP/plectis-proof-check.log"
          "$RUNNER_TEMP/plectis-dafny/dafny/dafny" --version >> "$RUNNER_TEMP/plectis-proof-check.log"
          make verify-operations verify-components DAFNY="$RUNNER_TEMP/plectis-dafny/dafny/dafny" 2>&1 | tee -a "$RUNNER_TEMP/plectis-proof-check.log"
      - name: Retain proof and mutation evidence
        if: always()
        # Public action tag: actions/upload-artifact@v7. Pinned by SHA below.
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: formal-proof-evidence
          path: |
            ${{ runner.temp }}/plectis-proof-check.log
            formal/**/metadata.json
          if-no-files-found: error
          retention-days: 14
      - name: Ensure proof checks preserve tracked inputs
        run: git diff --exit-code HEAD --
