<svg class="plate" viewBox="0 0 720 500" role="img" aria-labelledby="erdos-257-problem-title" focusable="false" data-plate="erdos-257-problem">
  <title id="erdos-257-problem-title">Erdős #257. Rows of dots for the numbers n = 2 to the i times 3 to the j up to 24 (1, 2, 3, 4, 6, 8, 9, 12, 16, 18, 24, then 27, 32 and so on): row n is 1 over 2 to the n minus 1 in binary, a dot at every n-th place after the point, over places 1 to 24. A cut after place 12 marks N = 12. The rows of 1, 2, 3, 4, 6 and 12, in red, divide 12 and repeat exactly after the cut, so each leaves 0; the other rows, in blue, do not repeat and leave 0.0588, 0.0137, 0.0625, 0.0156 and 0.000244, and the members from 27 on leave 0.0000315. The leftover at N = 12 totals 0.1509; over every n it would be 1.416.</title>
