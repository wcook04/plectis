  <title id="erdos-257-weighted-title">The displacement Delta(N) of Erdős #257&#x27;s proof, for the support A star at base 2 and N from 1 to 288, on a logarithmic scale: each N a tooth hanging from the axis, longer when the displacement is smaller. The multiples of 24, in red, hang far below the rest. Beside it, one exponent&#x27;s orbit: the multiples of 4 meet only the residues 4, 2 and 0 modulo 6.</title>
