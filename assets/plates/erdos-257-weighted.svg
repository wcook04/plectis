<svg class="plate" viewBox="0 0 720 500" role="img" aria-labelledby="erdos-257-weighted-title" focusable="false" data-plate="erdos-257-weighted" data-underdrawing="none">
  <title id="erdos-257-weighted-title">A table for Erdős #257 at base 2: rows are chosen exponents a = 2, 4, 6, 8, 12, 16, 20, 24 and all larger ones together, columns are the tests N = 24 to 288. Each cell is the leftover of 1 over 2 to the a minus 1 after multiplying by 2 to the N minus 1 and removing whole parts; the six rows whose exponent divides 24 are exactly zero. Below the table each column&#x27;s leftovers add up to a positive total, drawn as a stem; at the right each row&#x27;s mean. The mean of the column totals and the sum of the row means meet in the corner at 0.0423, inside a hatched square of side 1 over q, drawn for q = 10, that a rational value p over q would keep every total and every average out of.</title>
