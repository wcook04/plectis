<svg class="plate" viewBox="0 0 600 500" role="img" aria-labelledby="erdos-257-weighted-title" focusable="false" data-plate="erdos-257-weighted">
  <title id="erdos-257-weighted-title">The displacement Delta(N) of Erdős #257&#x27;s proof, for the support A star at base 2 and N from 1 to 288, on a logarithmic scale: each N a tooth hanging from the axis, longer when the displacement is smaller. A floor at 1/q, drawn for q = 10, tops a hatched region that a rational value would keep every tooth out of. Six combs above the axis mark the multiples of 2, 4, 6, 8, 12 and 24, which meet at the multiples of 24; there the red teeth plunge through the floor, and their dashed mean lies below it.</title>
