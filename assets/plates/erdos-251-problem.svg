<svg class="plate" viewBox="0 0 720 500" role="img" aria-labelledby="erdos-251-problem-title" focusable="false" data-plate="erdos-251-problem">
  <title id="erdos-251-problem-title">A staircase over a ruler from 0 to 1 whose slots halve: over the slot of width 1/2 stands a column of height 2, then 3 over the next quarter, 5 over the next eighth, then 7, 11, 13, 17, 19, 23 in ever thinner slots, rising into a spire at the right that a dashed line continues off the top for 29, 31 and every later prime; the staircase&#x27;s area is the sum of the primes over powers of two. Horizontal lines cut the same area into a floor of height 2 and one band per gap between consecutive primes, each band starting just after the slot of the smaller prime. In red, the band of the gap 2 between 3 and 5: its length, 1/8 + 1/16 + ... = 1/4, equals the slot of 3, so the band&#x27;s area is 2/4, the gap&#x27;s term in the gap series.</title>
