<svg class="plate" viewBox="0 0 720 500" role="img" aria-labelledby="erdos-1041-problem-title" focusable="false" data-plate="erdos-1041-problem">
  <title id="erdos-1041-problem-title">Erdős #1041. Left: the unit circle, dashed, and the region where ani&#x27;s degree-seven polynomial has modulus less than 1: seven hatched petals meeting near the centre, one root in each. The roots A and B and their petals are red; the dashed chord between A and B is 1.95 long and leaves the region. Right: the centre magnified, the disc of radius 1.3 times 10 to the minus 12. Only the arms of A and B reach it, and they join at the passage P, 0.82 times 10 to the minus 12 above the centre 0. Red lines leave P towards A and B: every path from A to B passes P, and the distances from A and B to P add up to more than 2. Dashed lines leave 0 towards A and B: the distances to the centre add up to just under 2, but the line towards A crosses empty ground, where the modulus exceeds 1, so that route leaves the region.</title>
