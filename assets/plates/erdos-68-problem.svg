<svg class="plate" viewBox="0 0 720 500" role="img" aria-labelledby="erdos-68-problem-title" focusable="false" data-plate="erdos-68-problem">
  <title id="erdos-68-problem-title">A chart against N from 2 to 12. N is the last term made whole: the multiplier makes every term up to n = N a whole number. The vertical axis, on a logarithmic scale, measures that multiplier times the tail left after the terms up to N. For e, multiplier N factorial, the values stay just below 1, inside the hatched strip of values below 1, which is why Fourier&#x27;s proof works. For the sum of 1 over n factorial minus 1, multiplier the common denominator of the first terms, the red values cross 1 at N = 4 and reach about 10 to the 30 at N = 12; the region between them and the line 1 is hatched in red.</title>
