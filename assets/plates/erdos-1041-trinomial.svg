<svg class="plate" viewBox="0 0 600 500" role="img" aria-labelledby="erdos-1041-trinomial-title" focusable="false" data-plate="erdos-1041-trinomial">
  <title id="erdos-1041-trinomial-title">The region where the quartic z^4 + (6/5) r^2 z^2 + r^4, r = 0.999, has modulus less than 1: an hourglass pinched at the origin, with its four zeros just inside the dashed unit circle. Straight segments join every zero to the origin inside the region; the red pair, of total length 1.998, joins two zeros. Beside it, the unit disc of values: the red segments map to a red leaf from b to 0 inside two triangles with vertices 0, b and minus zeta to the fourth.</title>
