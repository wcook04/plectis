<svg class="plate" viewBox="0 0 720 500" role="img" aria-labelledby="erdos-269-problem-title" focusable="false" data-plate="erdos-269-problem">
  <title id="erdos-269-problem-title">Erdős #269 for the primes 2, 3 and 5. The row a_n lists the 5-smooth numbers from 1 to 30, equally spaced, and continues. Above them, their running least common multiple as a staircase against a logarithmic scale marked 1, 10, 100, 1000 and 10000: it rises only at a prime power, by that prime (times 2 at 2, 4, 8 and 16; times 3 at 3, 9 and 27; times 5 at 5 and 25), so equal terms form runs. Runs of more than one term are red and bracketed: 5 and 6 share 60; 9, 10, 12 and 15 share 360; 16, 18, 20 and 24 share 720; 27 and 30 share 10800. The row running lcm gives each run&#x27;s value, and the row terms each run&#x27;s share of the sum: 1, 1/2, 1/6, 1/12, 2/60, 1/120, 4/360, 4/720, 1/3600 and 2/10800, and so on.</title>
