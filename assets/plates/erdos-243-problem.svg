<svg class="plate" viewBox="0 0 720 500" role="img" aria-labelledby="erdos-243-problem-title" focusable="false" data-plate="erdos-243-problem">
  <title id="erdos-243-problem-title">Five stacked bars, each one unit long, for Sylvester&#x27;s sequence 2, 3, 7, 43, 1807, whose reciprocal sum is 1. Bar n is the tail of the reciprocal sum from the n-th term on, multiplied by the product of the earlier terms: 1 times 1, 2 times one half, 6 times one sixth, 42 times one forty-second, 1806 times one over 1806, and each equals 1, so every whole number C_n is 1. In each bar the next term, times the product, takes all but the last 1 over a_n of the unit, hatched (1 times one half, 2 times one third, 6 times one seventh, 42 times one forty-third, 1806 times one over 1807); the rest of the tail, red, is enlarged by a_n (times 2, 3, 7, 43) into the next bar, where it is again exactly one.</title>
