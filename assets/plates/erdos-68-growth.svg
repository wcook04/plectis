<svg class="plate" viewBox="0 0 720 500" role="img" aria-labelledby="erdos-68-growth-title" focusable="false" data-plate="erdos-68-growth">
  <title id="erdos-68-growth-title">Left, two posts reaching the same ceiling 11 factorial: 11 factorial minus 1, one short, and 990 copies of 8 factorial minus 1, which fall 990 short; the gap between their tops is a ladder of 43 steps of 23, since both are multiples of 23. Lower right, twelve columns, one for each denominator counted back from N = 50, each N powers of N tall: the powers its gaps may share stack from the floor as a triangle of cells 1, 2, 3, and so on, and the powers kept, in red, last until the tenth column. Upper right, the limit on a shared axis: the line alpha and the cubic alpha cubed over 6, the lens between them filled with vertical chords; the longest, red, at alpha = root 2 above the tenth column, has length 2 root 2 over 3, and the dashed tangent to the cubic there is parallel to the line.</title>
