  <title id="erdos-68-growth-title">The region between the line y = alpha and the cubic y = alpha cubed over 6, for alpha from 0 to root 6, on axes where alpha is the block length k over root N and heights are logarithms divided by N to the 3 halves times log N. The region is filled with vertical chords, each a lower bound for the growth of the common denominator; the longest, red, at alpha = root 2, has length 2 root 2 over 3, and the dashed line is the cubic&#x27;s tangent there, parallel to the line. A separate circle shows the same estimate computed exactly at N = 128, one bar for each block length k; the longest, red, is at k = 13.</title>
