<svg class="plate" viewBox="0 0 600 500" role="img" aria-labelledby="erdos-251-intervals-title" focusable="false" data-plate="erdos-251-intervals">
  <title id="erdos-251-intervals-title">One stage of the #251 construction. Left, sixteen bars of one length, 30, each split between two neighbouring entries as 2d and 30 - 2d. Right, on a true-scale axis in steps w0 of the dyadic sum, a dot in row d at d steps and the bar of every sum still reachable after split d, three steps long; neighbouring bars overlap by two steps (the overlap of rows 7 and 8 in red), so their union beneath, in red, is one interval with no gap. Above, the top bar stretched 32/3 times horizontally: the next stage&#x27;s 32 intervals meet end to end and fill it exactly. One target on the axis is traced: it lies in bars 14 and 15, takes split 15, and in the stretched bar falls in the next stage&#x27;s interval 14.</title>
