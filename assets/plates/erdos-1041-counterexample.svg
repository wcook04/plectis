  <title id="erdos-1041-counterexample-title">The region where ani&#x27;s degree-seven polynomial from the Erdős #1041 short paper has modulus less than 1: seven petals with one root in each, the two red petals connected at the centre. Beside it, the disc of radius 4.4 times 10 to the minus 12 about the centre, where the arms come close at six critical points and the region passes through at one of them, the red mark.</title>
