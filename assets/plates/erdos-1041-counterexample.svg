<svg class="plate" viewBox="0 0 600 500" role="img" aria-labelledby="erdos-1041-counterexample-title" focusable="false" data-plate="erdos-1041-counterexample">
  <title id="erdos-1041-counterexample-title">The region where ani&#x27;s degree-seven polynomial from the Erdős #1041 short paper has modulus less than 1: seven petals with one zero in each; the two red zeros are 1.95 apart in a straight line. Beside it, the disc of radius 4.4 times 10 to the minus 12 about the centre, where the petals nearly touch at five points and meet at a sixth, the red mark, which joins the red petals. A dashed ellipse holds the points whose distances to the red zeros total 2; it passes through the centre, and in the disc the red mark lies just outside it, so the red legs from one zero through the passage to the other total more than 2.</title>
