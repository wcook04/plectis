  <title id="erdos-243-squares-title">Squaring modulo 7: the residues around a circle in steps of 2 (0, 2, 4, 6, 1, 3, 5), each with an arrow to its square. Arrows arrive only at 0, 1, 2 and 4, the hatched discs; 3, 5 and 6 are empty. Two red arrows show that 3 and 4 are the residues whose square is 2. Two red hops outside the circle, one step clockwise each, add 2 to them and land on 5 and 6, red rings where no arrow arrives.</title>
