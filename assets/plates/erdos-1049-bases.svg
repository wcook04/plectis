  <title id="erdos-1049-bases-title">Rational bases a over b as points with coordinates log b and log a. A hatched sector holds the bases that the criterion of Bundschuh and Väänänen covers; the paper&#x27;s cutoff is the red ray just outside it, and the first three powers of 31 over 4, red dots, lie between the two rays. 3 over 2, hollow, lies outside both. A disc enlarges the neighbourhood of 31 over 4 squared 64 times: the two rays separate into a strip, and the bases with denominator 16 in the window appear as points, hollow beyond the paper&#x27;s cutoff and red inside the strip.</title>
