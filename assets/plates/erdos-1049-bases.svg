  <title id="erdos-1049-bases-title">Erdős #1049. Left, a chart of the actual integer forms L n from Zudilin&#x27;s 2004 construction, on a logarithmic scale, for n from 1 to 6 at the bases 29 over 4, 31 over 4 and 33 over 4. At 31 over 4, before a common factor is cancelled the cleared forms rise off the chart; after it they fall from 3.1 times 10 to the minus 26, passing a level 1 over s that a rational value r over s would keep every positive form above. At 29 over 4 the forms turn back up; at 33 over 4 they fall faster. Right, rational bases a over b as points (log a, log b): the theorem covers the bases below a red ray of slope theta star, 0.405683, which lies above Bundschuh and Väänänen&#x27;s blue ray; the powers of 31 over 4 lie on one ray between the two, and a slit enlarges the row of bases a over 4: 29 over 4 above both rays, 31 over 4 between them, 33 over 4 below both.</title>
