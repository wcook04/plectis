<svg class="plate" viewBox="0 0 600 500" role="img" aria-labelledby="erdos-1049-bases-title" focusable="false" data-plate="erdos-1049-bases">
  <title id="erdos-1049-bases-title">Rational bases a over b as points with coordinates log a, across, and log b, up, so that the slope of a base&#x27;s ray from the corner is log b over log a. The first three powers of 31 over 4 lie on one ray. A hatched sector below a blue ray holds the bases covered by the criterion of Bundschuh and Väänänen; the paper&#x27;s cutoff is the red ray just above it, and the powers of 31 over 4, red, lie between the two. 3 over 2, hollow, lies above both. A slit enlarges 80 times the row of bases with denominator 16 around 31 over 4 squared: the two rays separate into a band, and the row&#x27;s points are hollow before the red ray, red across the band, and blue past the blue ray.</title>
