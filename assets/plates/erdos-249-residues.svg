  <text class="pl-text pl-text--ink" x="10" y="425">sum = ¾<tspan class="pl-var">f</tspan>(1) + ¼<tspan class="pl-var">c</tspan></text>
  <text class="pl-text pl-text--ink" x="518" y="403">tail − <tspan class="pl-var">c</tspan> = 0</text>
  </g>
