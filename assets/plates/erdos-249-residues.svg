  <title id="erdos-249-residues-title">A ledger of Euler&#x27;s totient at 543 to 551 reduced mod 8: zeros everywhere except the prime 547, which leaves 2 and scores 1. Beside each row, on a fixed ruler with whole-number marks at minus 1, 0 and 1, a hatched bar shows every value 15 times the tail after 542 could take given the scores read so far: the four zeros before 547 halve it down until only 0 fits, the zeros after 547 halve it around 15/32 until it lies strictly between 0 and 1, so the sum is not a fraction with denominator 15. A last row shows that when all even remainders score alike, the tail is exactly 0 and the sum is 3f(1)/4 + c/4.</title>
