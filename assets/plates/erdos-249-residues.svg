  <title id="erdos-249-residues-title">The binary digits of the number sigma whose n-th digit is 1 when Euler&#x27;s totient of n is 2 more than a multiple of 4, for n from 1 to 812 in rows of 58: strokes for 1s, faint ticks for 0s, rings at n = 1 and 2 where the totient is odd. In the last row a 1 at 787 stands between 20 zeros and 23, and the row is written out below. Under each digit a stem hangs, on a log scale, to the binary fraction formed by the digits after it; a floor at 1/q, drawn for q = 750000, tops a hatched region, and the red stems after the runs beside 787 reach into it.</title>
