  <title id="erdos-1049-problem-title">Erdős #1049. Horizontal axis: N, the number of terms of the series made whole by clearing denominators, from 0 to 20. Vertical axis: what is left over, on a logarithmic scale from 1 to 10 to the 7. At the base 2, in blue, the leftover is the expansion read from place N and stays between 1 and 5. At the base 3 over 2, in red, it climbs above the dashed lower bound 2 to the N plus 1, past 8.5 million at N = 20. The drawing shows this one way of clearing only; it does not decide whether the total at 3 over 2 is irrational, which is open.</title>
